apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-envoy-sidecars
  namespace: socialnetwork
  labels:
    release: social-network
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
    - key: security.istio.io/tlsMode
      operator: Exists
  podMetricsEndpoints:
  - path: /stats/prometheus
    port: "15000"
    interval: 1s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: thrift-envoy-stats
  namespace: socialnetwork
  labels:
    release: social-network
spec:
  namespaceSelector:
    matchNames:
    - socialnetwork
  selector:
    matchLabels: {}
  podMetricsEndpoints:
  - interval: 15s
    path: /stats/prometheus
    port: "15000"
